  <body>
    <main>
      <canvas id="view" aria-label="The tesseract's shadow in 3D, drawn on the screen"></canvas>
      <aside>
        <h1>The tesseract</h1>
        <p id="status">Each slider turns it in one plane, in radians. The last three turn it into w.</p>
        <div id="sliders"></div>
        <div id="matrix"></div>
        <p class="note">
          M = R<sub>zw</sub> R<sub>yw</sub> R<sub>xw</sub> R<sub>yz</sub> R<sub>xz</sub> R<sub>xy</sub>:
          xy turns first, zw last.
        </p>

    </main>
